<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Roles Workshop Companion · Hradec Králové</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>

:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#1b2133; --muted:#5d6477; --line:#e3e0d8; --navy:#18203d;
  --analyst:#5a48d8; --analyst-bg:#eeecfd; --analyst-ink:#3f2fb8;
  --diplomat:#0e9a6a; --diplomat-bg:#e2f5ed; --diplomat-ink:#08754f;
  --sentinel:#0a82c4; --sentinel-bg:#e1f0f9; --sentinel-ink:#06659a;
  --explorer:#d68a00; --explorer-bg:#fdf1d8; --explorer-ink:#8a5600;
  --none:#9aa0ad; --none-bg:#f0efeb;
  --radius:14px; --shadow:0 1px 2px rgba(20,25,45,.06),0 4px 14px rgba(20,25,45,.05);
  --fs:15px;
}
*{box-sizing:border-box}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid #f2b705;outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* Header */
header.top{background:radial-gradient(1200px 300px at 85% -40%,rgba(214,138,0,.28),transparent 60%),radial-gradient(900px 260px at 0% 120%,rgba(90,72,216,.45),transparent 60%),var(--navy);color:#fff;padding:18px 0 22px}
.toprow{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;opacity:.75;font-weight:600}
h1{font-family:Fraunces,Georgia,serif;font-weight:700;font-size:1.9rem;margin:4px 0 2px;letter-spacing:-.01em}
.sub{opacity:.8;font-size:.95rem;max-width:640px}
.topctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.seg button{background:none;border:0;color:#fff;padding:6px 12px;border-radius:999px;font-weight:600;font-size:.85rem}
.seg button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.switch{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:0;color:#fff;border-radius:999px;padding:6px 12px 6px 6px;font-weight:600;font-size:.85rem}
.switch .knob{width:34px;height:20px;border-radius:999px;background:rgba(255,255,255,.3);position:relative;transition:.2s}
.switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.switch[aria-pressed="true"] .knob{background:#f2b705}
.switch[aria-pressed="true"] .knob::after{left:16px}

/* Starting point */
.start{margin-top:-2px;background:var(--card);border-radius:0 0 var(--radius) var(--radius);box-shadow:var(--shadow);padding:16px 18px 14px}
.start h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px;font-weight:700}
.startgrid{display:grid;grid-template-columns:repeat(4,1fr) minmax(210px,260px);gap:10px}
.rolecard{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:left;transition:.15s;position:relative}
.rolecard:hover{transform:translateY(-1px)}
.rolecard .rn{font-weight:800;font-size:1.02rem;display:flex;align-items:center;gap:8px}
.rolecard .rt{font-size:.82rem;color:var(--muted)}
.rolecard .rc{font-size:.72rem;letter-spacing:.05em;color:var(--muted);margin-top:4px;font-weight:600}
.rolecard[aria-pressed="true"]{border-color:var(--c);background:var(--cbg);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.rolecard[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;color:var(--c);font-weight:800}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);display:inline-block;flex:none}
.codebox{border:2px dashed var(--line);border-radius:12px;padding:8px 12px}
.codebox label{font-size:.78rem;font-weight:700;color:var(--muted)}
.codebox input{width:100%;border:1px solid var(--line);border-radius:8px;padding:6px 10px;text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-top:4px;background:#fbfaf7}
.codemsg{font-size:.8rem;margin-top:4px;min-height:1.2em;color:var(--muted)}
.reminder{margin-top:12px;display:flex;gap:10px;align-items:flex-start;background:var(--cbg,#f3f1ea);border-left:4px solid var(--c,#c9c4b5);border-radius:10px;padding:10px 12px;font-size:.92rem}
.reminder b{color:var(--cink,inherit)}
.reminder .ico{font-size:1.1rem;line-height:1.2}

/* Nav + actions */
.navbar{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin:18px 0 12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;padding:8px 14px;border-radius:999px;font-weight:700;font-size:.9rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab .badge{display:inline-block;margin-left:6px;font-size:.72rem;background:rgba(127,127,127,.18);padding:1px 7px;border-radius:999px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;font-weight:600;font-size:.86rem;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:#bdb8aa}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.danger{color:#b42318}
.btn.danger:hover{border-color:#b42318}

/* Board */
.board{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start}
.side{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card h3{margin:0 0 8px;font-size:1.05rem}
.kicker{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.brief{font-size:.92rem;color:#353c50}
.ptitle{font-family:Fraunces,Georgia,serif;font-size:1.3rem;margin:2px 0 6px;line-height:1.2}
.bars{display:flex;flex-direction:column;gap:8px}
.barrow{display:grid;grid-template-columns:92px 1fr 28px;gap:8px;align-items:center;font-size:.86rem;font-weight:600}
.bartrack{height:12px;background:#efede7;border-radius:999px;overflow:hidden}
.barfill{height:100%;background:var(--c);border-radius:999px;transition:width .35s ease}
.barrow .n{text-align:right;font-variant-numeric:tabular-nums}
.stack{display:flex;height:16px;border-radius:999px;overflow:hidden;background:#efede7;margin:4px 0 10px}
.stack span{height:100%;background:var(--c);transition:width .35s}
.note{font-size:.84rem;color:var(--muted);margin-top:10px}
.warn{font-size:.84rem;background:#fff6e0;border:1px solid #f3dc9b;color:#6b4a00;border-radius:10px;padding:8px 10px;margin-top:10px}
.good{font-size:.84rem;background:#e7f6ee;border:1px solid #b5e2c9;color:#0b5c3e;border-radius:10px;padding:8px 10px;margin-top:10px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 11px;font-size:.82rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.chip .dot{width:9px;height:9px}
.spacer{flex:1}
.check{display:inline-flex;gap:6px;align-items:center;font-size:.84rem;color:var(--muted);font-weight:600}

.tasks{display:flex;flex-direction:column;gap:8px}
.task{background:#fff;border-radius:12px;box-shadow:var(--shadow);border-left:5px solid var(--c,var(--line));padding:10px 12px;display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;transition:box-shadow .2s,background .2s}
.task.match{box-shadow:0 0 0 2px var(--mc),var(--shadow);background:linear-gradient(90deg,var(--mbg),#fff 55%)}
.num{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:#f0eee8;color:var(--muted)}
.task[data-role] .num{background:var(--c);color:#fff}
.ttl{font-weight:600}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.tag{font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--cbg);color:var(--cink);display:inline-flex;gap:5px;align-items:center}
.tag.star{background:var(--mc);color:#fff}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pills{display:inline-flex;gap:4px;background:#f4f2ec;padding:3px;border-radius:10px}
.pill{border:0;background:transparent;border-radius:8px;padding:6px 9px;font-weight:700;font-size:.8rem;color:var(--muted);min-width:34px}
.pill:hover{background:#fff}
.pill[aria-pressed="true"]{background:var(--c);color:#fff}
.pill.clear{min-width:28px;font-weight:600}
.member{width:130px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:.84rem;background:#fbfaf7}
.member::placeholder{color:#a7a9b2}
.empty{padding:28px;text-align:center;color:var(--muted);background:#fff;border-radius:12px;border:1px dashed var(--line)}

/* Compare */
.cmpgrid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.insights{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.insight{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;border-top:4px solid var(--c,var(--ink))}
.insight .big{font-family:Fraunces,Georgia,serif;font-size:1.6rem;line-height:1.1}
.insight p{margin:6px 0 0;font-size:.88rem;color:#3a4155}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);font-weight:600;margin-bottom:8px}
.legend span{display:inline-flex;gap:5px;align-items:center}
.duo{display:grid;grid-template-columns:92px 1fr 1fr;gap:8px;align-items:center;font-size:.85rem;font-weight:600;margin-bottom:6px}
.duo .hd{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.mini{display:flex;align-items:center;gap:6px}
.mini .bartrack{flex:1;height:10px}
.mini .barfill.ghost{background:repeating-linear-gradient(45deg,var(--c),var(--c) 3px,color-mix(in srgb,var(--c) 45%,#fff) 3px,color-mix(in srgb,var(--c) 45%,#fff) 6px)}
.mini b{width:20px;text-align:right;font-variant-numeric:tabular-nums}
.matchlist{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:6px}
.matchlist li{display:flex;gap:8px;align-items:flex-start;font-size:.9rem}
.matchlist .nn{flex:none;font-weight:800;font-size:.75rem;background:var(--cbg);color:var(--cink);border-radius:6px;padding:2px 6px;margin-top:1px}
table.load{width:100%;border-collapse:collapse;font-size:.88rem}
table.load th,table.load td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
table.load th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
table.load td.n{text-align:center;font-variant-numeric:tabular-nums}

/* Reflection */
.refgrid{display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
.q{margin-bottom:16px}
.q label{display:block;font-weight:700;margin-bottom:6px}
.q .qn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:.78rem;margin-right:8px}
.q textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;resize:vertical;background:#fbfaf7;line-height:1.5}
.hints{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.hint{border:1px dashed var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:.78rem;color:var(--muted)}
.hint:hover{border-color:var(--c,#999);color:var(--ink)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.fields input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fbfaf7}
.fields label{font-size:.78rem;font-weight:700;color:var(--muted)}
.saved{font-size:.78rem;color:var(--muted)}

/* Modal + toast */
.modal{position:fixed;inset:0;background:rgba(16,20,36,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal.open{display:flex}
.dialog{background:#fff;border-radius:16px;max-width:620px;width:100%;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.dialog h3{margin:0 0 6px}
.dialog textarea{width:100%;min-height:200px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;border:1px solid var(--line);border-radius:10px;padding:10px}
.dialog .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
.optlist{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.optlist label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Print view */
#printView{display:none}
.pv{background:#fff;color:#111;padding:28px;max-width:900px;margin:0 auto;font-size:12px}
.pv h1{font-family:Fraunces,Georgia,serif;color:#111;font-size:22px;margin:0}
.pv h2{font-size:15px;margin:18px 0 6px;border-bottom:2px solid #111;padding-bottom:3px}
.pv table{width:100%;border-collapse:collapse}
.pv td,.pv th{border-bottom:1px solid #ddd;padding:4px 6px;text-align:left;vertical-align:top}
.pv .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pv .ans{white-space:pre-wrap;border:1px solid #ddd;border-radius:6px;padding:8px;min-height:40px}
.pvbar{position:sticky;top:0;background:var(--navy);color:#fff;padding:10px 20px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.pvbar .btn{background:#fff}
body.printing #app{display:none}
body.printing #printView{display:block}

/* Presenter mode */
body.presenter{--fs:18px}
body.presenter .member{display:none}
body.presenter .mname{display:inline-flex}
body.presenter [data-personal]{display:none!important}
body.presenter .task{padding:14px 16px}
body.presenter .pill{padding:9px 12px;font-size:.9rem}
.mname{display:none;font-size:.8rem;font-weight:700;color:var(--muted);background:#f4f2ec;border-radius:8px;padding:6px 10px}
.presbanner{display:none;background:#f2b705;color:#1b2133;font-weight:700;text-align:center;font-size:.85rem;padding:5px}
body.presenter .presbanner{display:block}

footer{margin:30px 0 40px;text-align:center;font-size:.82rem;color:var(--muted)}

@media (max-width:1020px){
  .startgrid{grid-template-columns:repeat(2,1fr)}
  .codebox{grid-column:1/-1}
  .board,.refgrid{grid-template-columns:1fr}
  .side{position:static}
  .insights{grid-template-columns:1fr}
}
@media (max-width:760px){
  .cmpgrid{grid-template-columns:1fr}
  .task{grid-template-columns:30px 1fr}
  .ctrl{grid-column:1/-1;justify-content:flex-start}
  h1{font-size:1.5rem}
  .fields{grid-template-columns:1fr}
}
@media print{
  body{background:#fff}
  #app,.modal,.toast,.pvbar{display:none!important}
  #printView{display:block!important}
  .pv{padding:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- v2 additions ---- */
.btn.accent{background:#f2b705;border-color:#f2b705;color:#1b2133}
.btn.accent:hover{border-color:#d9a300}
.btn.ghost{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.btn.sm{padding:5px 9px;font-size:.8rem}
.codeout{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all;background:#f6f4ee;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:140px;overflow:auto;user-select:all}

/* Intro slider */
.intro{position:fixed;inset:0;z-index:80;background:radial-gradient(900px 400px at 90% 0%,rgba(242,183,5,.25),transparent 60%),radial-gradient(800px 400px at 0% 100%,rgba(90,72,216,.45),transparent 60%),#121833;display:none;align-items:center;justify-content:center;padding:18px}
.intro.open{display:flex}
.icard{background:#fff;border-radius:22px;max-width:980px;width:100%;max-height:calc(100vh - 36px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4);display:flex;flex-direction:column}
.itop{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.itop .seg{background:#efede7}
.itop .seg button{color:var(--ink)}
.itop .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.ibody{display:grid;grid-template-columns:1fr 1.1fr;gap:26px;padding:26px 28px;align-items:center;min-height:340px}
.ivis{background:linear-gradient(135deg,#f6f4ee,#eceaf9);border-radius:18px;min-height:280px;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
.itext .kicker{margin-bottom:6px}
.itext h2{font-family:Fraunces,Georgia,serif;font-size:1.75rem;line-height:1.15;margin:0 0 12px}
.itext p{font-size:1.06rem;color:#353c50;margin:0}
.ibot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots button{width:10px;height:10px;border-radius:50%;border:0;background:#d9d5ca;padding:0}
.dots button[aria-current="true"]{background:var(--ink);width:26px;border-radius:999px}
.listen{display:inline-flex;align-items:center;gap:8px}
.listen .wave{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.listen .wave i{width:3px;background:currentColor;border-radius:2px;height:4px}
.listen.on .wave i{animation:wv .9s infinite ease-in-out}
.listen.on .wave i:nth-child(2){animation-delay:.15s}.listen.on .wave i:nth-child(3){animation-delay:.3s}.listen.on .wave i:nth-child(4){animation-delay:.45s}
@keyframes wv{0%,100%{height:4px}50%{height:14px}}
.vnote{font-size:.8rem;color:var(--muted);padding:0 28px 10px}
.ptr{position:absolute;font-size:2rem;animation:bob 1.2s infinite ease-in-out;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));pointer-events:none}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.mk{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px}
.mkgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mkrole{background:#fff;border-radius:12px;padding:10px 12px;border:2px solid transparent;box-shadow:var(--shadow)}
.mkrole b{display:flex;gap:6px;align-items:center}
.mkrole span{font-size:.78rem;color:var(--muted)}
.mkrole.on{border-color:var(--c);background:var(--cbg)}
.mkproj{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:center}
.mkproj .em{font-size:2rem}
.mkproj b{display:block}
.mkproj span{font-size:.8rem;color:var(--muted)}
.mkrow{background:#fff;border-radius:12px;padding:10px;box-shadow:var(--shadow);border-left:5px solid var(--c)}
.mkrow .ttl{font-size:.9rem;margin-bottom:8px}
.mkbars .barrow{grid-template-columns:80px 1fr 20px}
.mkq{background:#fff;border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;font-size:.88rem;font-weight:600}
.mkq .qn{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:.78rem;flex:none}
.bigemoji{font-size:4.5rem;text-align:center;line-height:1}

/* Class overview */
.clsgrid{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start;margin-bottom:18px}
.qrbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;max-width:240px;margin:0 auto}
.qrbox svg{width:100%;height:auto;display:block}
.urlin{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:.82rem;background:#fbfaf7;margin:4px 0 8px}
ol.steps{margin:8px 0 0;padding-left:20px;font-size:.88rem;color:#3a4155}
ol.steps li{margin-bottom:4px}
.collect textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;background:#fbfaf7}
.sessbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:12px 16px;margin-bottom:18px}
.sessbar input{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-weight:700;min-width:220px;background:#fbfaf7}
.sessbar .meta2{font-size:.82rem;color:var(--muted)}
.archbanner{background:#fff6e0;border:1px solid #f3dc9b;color:#6b4a00;border-radius:12px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between;font-weight:600}
.cls3{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}
.teamlist{display:flex;flex-direction:column;gap:8px}
.teamrow{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.teamrow .tn{font-weight:800;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.teamrow .tm{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.cons{display:flex;flex-direction:column;gap:6px}
.consrow{display:grid;grid-template-columns:28px 1fr 190px 92px;gap:10px;align-items:center;font-size:.86rem;padding:6px 0;border-bottom:1px solid var(--line)}
.consrow .stack{margin:0;height:12px}
.consrow .pct{font-size:.78rem;font-weight:700;text-align:right}
.archlist{display:flex;flex-direction:column;gap:8px}
.archrow{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.archrow .an{font-weight:700}
.archrow .ad{font-size:.78rem;color:var(--muted)}
.bigqr{text-align:center}
.bigqr .qrbox{max-width:min(70vh,520px);padding:16px}
.bigqr .u{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1rem;word-break:break-all;margin-top:12px}
.dialog.wide{max-width:900px}
.tblwrap{overflow-x:auto}

@media (max-width:860px){
  .ibody{grid-template-columns:1fr;padding:18px;gap:16px;min-height:0}
  .ivis{min-height:200px}
  .itext h2{font-size:1.4rem}
  .clsgrid,.cls3{grid-template-columns:1fr}
  .consrow{grid-template-columns:24px 1fr;}
  .consrow .stack,.consrow .pct{grid-column:2}
  .consrow .pct{text-align:left}
}
@media (max-width:560px){
  .navbar .actions .btn{font-size:.78rem;padding:6px 9px}
  .tab{padding:7px 11px;font-size:.84rem}
  .pill{min-width:38px;padding:8px 9px}
  .member{width:100%}
  .ctrl{width:100%}
  .start{padding:12px}
  .rolecard{padding:8px 10px}
}

/* Instructor-only controls */
body:not(.instructor) [data-instructor]{display:none!important}
.instrbadge{font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#f2b705;color:#1b2133;border-radius:999px;padding:4px 10px}
.joinrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.joinrow label{font-size:.78rem;font-weight:700;color:var(--muted)}
.joinrow input{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fbfaf7;font-weight:600}

/* Conclusions deck */
.deck{position:fixed;inset:0;z-index:85;background:#121833;color:#fff;display:none;flex-direction:column}
.deck.open{display:flex}
.dk-top,.dk-bot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;flex-wrap:wrap}
.dk-bot{justify-content:center}
.dk-brand{font-weight:700;opacity:.85}
.dk-n{font-weight:700;opacity:.8;min-width:60px;text-align:center}
.dk-stage{flex:1;display:flex;align-items:center;justify-content:center;padding:0 18px;overflow:auto}
.dk-slide{background:#fff;color:var(--ink);border-radius:20px;width:min(1200px,100%);aspect-ratio:16/9;max-height:calc(100vh - 130px);padding:3.2% 4%;display:flex;flex-direction:column;gap:2.4%;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.dk-h h2{font-family:Fraunces,Georgia,serif;font-size:clamp(1.4rem,3.2vw,2.6rem);margin:2px 0;line-height:1.1}
.dk-sub{color:var(--muted);font-weight:600}
.dk-2{display:grid;grid-template-columns:1fr 1fr;gap:4%;flex:1;min-height:0}
.dk-col h3{margin:0 0 8px;font-size:1.15rem}
.dk-bars .barrow{grid-template-columns:110px 1fr 44px;font-size:1rem}
.dk-bars .bartrack{height:16px}
.dk-teams{display:flex;flex-direction:column;gap:8px;overflow:auto}
.dk-ins{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.dk-ins li{border-left:5px solid var(--c);background:#f7f6f2;border-radius:10px;padding:9px 12px;font-size:1.02rem;font-weight:600}
.dk-disc{background:linear-gradient(135deg,#f6f4ee,#eceaf9);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column}
.dk-disc ol{margin:8px 0 12px;padding-left:20px;font-size:1.02rem}
.dk-disc li{margin-bottom:8px}
.dk-close{margin-top:auto;font-weight:700;color:var(--analyst-ink)}
.pslide{page-break-after:always;break-after:page;padding:10px 0}
.pslide .dk-slide{box-shadow:none;border:1px solid #ddd;max-height:none}
@media (max-width:860px){ .dk-2,.joinrow{grid-template-columns:1fr} .dk-slide{aspect-ratio:auto;max-height:none} }
@media print{ .deck{display:none!important} .pslide .dk-slide{width:100%;aspect-ratio:16/9} *{-webkit-print-color-adjust:exact;print-color-adjust:exact} }
.dk-score{font-size:.95rem;color:var(--muted);font-weight:600;margin:0 0 10px}
.dk-score b{font-family:Fraunces,Georgia,serif;font-size:2.2rem;color:var(--ink);margin-right:4px}
.dk-col .matchlist li{font-size:.9rem}
/* Intro: full screen for projection */
.intro{padding:0}
.icard{max-width:none;width:100%;height:100%;max-height:none;border-radius:0}
.ibody{flex:1;padding:3vh 5vw;gap:4vw}
.ivis{min-height:52vh;font-size:clamp(14px,1.25vw,20px)}
.ivis .mk{max-width:min(560px,100%)}
.itext h2{font-size:clamp(1.8rem,3.4vw,3.2rem)}
.itext p{font-size:clamp(1.05rem,1.7vw,1.6rem);line-height:1.5}
.itext .kicker{font-size:.9rem}
.ivis .qrbox{max-width:min(46vh,380px)!important}
.classbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:var(--radius);padding:12px 16px;margin-bottom:18px}
.classbar .kicker{color:#f2b705}
.classbar select{font-weight:700;border-radius:8px;border:0;padding:7px 10px;min-width:240px;color:var(--ink)}
.classbar .meta2{font-size:.82rem;opacity:.85}
.clspill{display:inline-block;background:#eeecfd;color:var(--analyst-ink);border-radius:999px;padding:4px 12px;font-size:.85rem;margin-bottom:8px}
select.teamsel{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fbfaf7;font-weight:600}
.joinrow select.teamsel{margin-top:0}
.fields select.teamsel{padding:8px 10px}
.grpta{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;background:#fbfaf7}
.gsum{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.gtable td,.gtable th{padding:5px 6px}
.gtable .gc{text-align:center;white-space:nowrap}
.gtable .gteam{background:#f6f4ee}
.gl{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--c);color:#fff;font-weight:800;font-size:.78rem}
.classbar .btn:not(.accent){color:var(--ink)}
body.instructor #joinRow{display:none}

</style>

function merge(base, src){
  if(!src || typeof src!=="object") return base;

  if(src.cls && typeof src.cls.i==="string") base.cls={i:src.cls.i,n:String(src.cls.n||""),g:Array.isArray(src.cls.g)?src.cls.g.map(String):[]};

  if(ROLES.indexOf(src.myRole)>-1) base.myRole=src.myRole;
  if(src.assign){ ["p1","p2"].forEach(function(p){ var a=src.assign[p]||{}; for(var n=1;n<=20;n++){ var x=a[n]; if(x){ base.assign[p][n]={role:ROLES.indexOf(x.role)>-1?x.role:null,member:typeof x.member==="string"?x.member.slice(0,60):""}; } } }); }

function pickVoice(){
  if(!("speechSynthesis" in window)) return null;
  var vs=speechSynthesis.getVoices()||[], want=LOCALE[S.lang].toLowerCase(), pre=S.lang;
  var exact=vs.filter(function(v){return (v.lang||"").replace("_","-").toLowerCase()===want;});
  var loose=vs.filter(function(v){return (v.lang||"").toLowerCase().indexOf(pre)===0;});
  var list=exact.length?exact:loose; if(!list.length) return null;

var speakGen=0, lastWasBusy=false, ttsDiag="";
function diag(msg){ ttsDiag=msg; var el=$("#iDiag"); if(el) el.textContent=msg; }
var uttRefs=[];
function browserSpeak(say){
  if(!("speechSynthesis" in window)){ voiceNote(true); diag("speechSynthesis: brak w tej przeglądarce / not supported"); return; }
  var synth=window.speechSynthesis, gen=speakGen, started=false;
  function mk(txt, v, last){
    var u=new SpeechSynthesisUtterance(txt); u.lang=LOCALE[S.lang]; if(v) u.voice=v; u.rate=1; u.volume=1;
    u.onstart=function(){ started=true; if(gen===speakGen){ setSpeaking(true); diag(base+" · ▶"); } };
    u.onend=function(){ if(gen===speakGen && last){ setSpeaking(false); diag(base+" · ✓"); } };
    u.onerror=function(ev){ if(ev && ev.error && ev.error!=="interrupted" && ev.error!=="canceled") diag(base+" · error: "+ev.error); if(gen===speakGen && last) setSpeaking(false); };
    uttRefs.push(u); return u;
  }
  var base="";
  var go=function(){
    if(gen!==speakGen) return;
    uttRefs=[];
    var vs=synth.getVoices()||[], v=pickVoice(); voiceNote(!v);
    base="🔧 "+vs.length+" voices · "+(v?(v.name+" ("+v.lang+")"):"default / "+LOCALE[S.lang]); diag(base+" · …");
    var parts=(say.match(/[^.!?…]+[.!?…]*/g)||[say]).map(function(x){return x.trim();}).filter(Boolean);
    parts.forEach(function(txt,i){ synth.speak(mk(txt, v, i===parts.length-1)); });
    setSpeaking(true); try{ if(synth.paused) synth.resume(); }catch(e){}
    // fallback: some browsers (iOS Safari) stay silent with an explicit voice — retry once without it
    setTimeout(function(){
      if(started || gen!==speakGen) return;
      try{ synth.cancel(); }catch(e){}
      setTimeout(function(){ if(gen!==speakGen) return; base+=" · retry"; uttRefs=[]; synth.speak(mk(say, null, true)); try{ synth.resume(); }catch(e){} },120);
    },1800);
  };
  if(!synth.getVoices().length){ var done=false, h=function(){ if(done) return; done=true; go(); };
    try{ synth.addEventListener("voiceschanged",h,{once:true}); }catch(e){ synth.onvoiceschanged=h; } setTimeout(h,700); }
  else if(lastWasBusy) setTimeout(go,150);
  else go();
}

  setSpeaking(false);
}

function encodeSub(){
  var R=S.reflection;
  function line(p){ var s=""; for(var n=1;n<=20;n++){ var r=a(p,n).role; s+=r?LETTER[r]:"-"; } return s; }
  function mems(p){ var arr=[]; for(var n=1;n<=20;n++) arr.push(a(p,n).member||""); while(arr.length && !arr[arr.length-1]) arr.pop(); return arr; }
  var o={v:1,k:S.cls?S.cls.i:"",n:R.name.trim(),t:R.team.trim(),r:S.myRole?LETTER[S.myRole]:"",c:codeToRole(S.myCode)?S.myCode:"",l:S.lang,a1:line("p1"),a2:line("p2"),m1:mems("p1"),m2:mems("p2"),q:[R.q1,R.q2,R.q3],at:new Date().toISOString()};
  return "HK1:"+b64e(JSON.stringify(o));
}
function cleanSub(o){
  if(!o || typeof o!=="object" || typeof o.n!=="string" || !o.n.trim()) return null;
  function str(x,max){ return typeof x==="string"?x.slice(0,max):""; }
  function line(x){ x=str(x,20).toUpperCase(); var s=""; for(var i=0;i<20;i++){ var ch=x.charAt(i); s+=FROMLETTER[ch]?ch:"-"; } return s; }
  function mems(x){ var arr=[]; for(var i=0;i<20;i++) arr.push(Array.isArray(x)?str(x[i],60):""); return arr; }
  var q=Array.isArray(o.q)?o.q:[];
  return {k:str(o.k,40),n:str(o.n,60).trim(),t:str(o.t,60).trim(),r:FROMLETTER[o.r]?o.r:"",c:str(o.c,6).toUpperCase(),l:str(o.l,2),a1:line(o.a1),a2:line(o.a2),m1:mems(o.m1),m2:mems(o.m2),q:[str(q[0],4000),str(q[1],4000),str(q[2],4000)],at:str(o.at,40)||new Date().toISOString()};
}
function decodeToken(tok){ try{ return cleanSub(JSON.parse(b64d(tok.replace(/^HK1:/,"")))); }catch(e){ return null; } }
function subFromFullExport(o){
  if(!o || !o.assign || !o.reflection) return null;
  function line(p){ var s=""; for(var n=1;n<=20;n++){ var x=(o.assign[p]||{})[n]; s+= (x && LETTER[x.role])?LETTER[x.role]:"-"; } return s; }
  function mems(p){ var arr=[]; for(var n=1;n<=20;n++){ var x=(o.assign[p]||{})[n]; arr.push(x&&x.member?x.member:""); } return arr; }
  var R=o.reflection;
  return cleanSub({n:R.name,t:R.team,r:LETTER[o.myRole]||"",c:o.myCode,l:o.lang,a1:line("p1"),a2:line("p2"),m1:mems("p1"),m2:mems("p2"),q:[R.q1,R.q2,R.q3],at:o.exportedAt});
}
function teamLabel(nm){ nm=String(nm||"").trim(); if(!nm) return t("noTeam"); return /^\d+$/.test(nm)?t("teamWord")+" "+nm:nm; }
function subKey(s){ return (s.n+"|"+s.t).toLowerCase(); }
/* returns {subs:[], archives:[], bad:n} */
function parseIncoming(text){
  var out={subs:[],archives:[],bad:0}, seen=0;
  var toks=String(text).match(/HK1:[A-Za-z0-9+\/=]+/g)||[];
  toks.forEach(function(tk){ seen++; var s=decodeToken(tk); if(s) out.subs.push(s); else out.bad++; });
  var trimmed=String(text).trim();
  if(!toks.length && trimmed.charAt(0)==="{"){
    try{ var o=JSON.parse(trimmed);
      if(o && o.type==="class-archive" && o.session && o.session.students){ out.archives.push(o.session); }
      else { var s2=subFromFullExport(o); if(s2) out.subs.push(s2); else out.bad++; }
    }catch(e){ out.bad++; }
  }
  return out;
}
function addIncoming(texts){
  var added=0, bad=0, arch=0, moved=0;
  texts.forEach(function(tx){
    var r=parseIncoming(tx); bad+=r.bad;
    r.subs.forEach(function(s){ var tgt=C.session;
      if(s.k){ var other=C.classes.filter(function(x){return x.id===s.k;})[0]; if(other){ tgt=other; if(other!==C.session) moved++; } }
      var k=subKey(s), old=tgt.students[k]; if(!old || (s.at||"")>=(old.at||"")){ tgt.students[k]=s; } added++; });
    r.archives.forEach(function(se){ if(!C.archives.some(function(x){return x.id===se.id;})){ C.archives.push(sanitizeSession(se)); arch++; } });
  });
  saveC();
  if(arch) toast(t("archImported"));
  else if(added) toast(t("clsAdded")(added,bad)+(moved?" "+t("movedTo")(moved):""));
  else toast(t("clsNone"));
  render();
}
function sanitizeSession(se){
  var st={}; Object.keys(se.students||{}).forEach(function(k){ var s=cleanSub(se.students[k]); if(s) st[subKey(s)]=s; });
  return {id:String(se.id||("s"+Date.now())).slice(0,40), name:String(se.name||"Session").slice(0,80), groups:Array.isArray(se.groups)?se.groups.map(String):[], startedAt:String(se.startedAt||""), archivedAt:String(se.archivedAt||new Date().toISOString()), students:st};
}

function sessionCSV(se){
  function q(v){ v=String(v==null?"":v); return /[",\n;]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
  var head=["name","team","role_group","code","p1_assigned","p2_assigned"];
  for(var i=1;i<=20;i++) head.push("P1_"+i); for(i=1;i<=20;i++) head.push("P2_"+i);
  head=head.concat(["q1_talents","q2_known_for","q3_limitations","submitted_at"]);
  var rows=[head.join(",")];
  studentsOf(se).forEach(function(s){ var r=FROMLETTER[s.r]; var row=[s.n,s.t,r?ROLE[r].en.name:"",s.c,s.a1.replace(/-/g,"").length,s.a2.replace(/-/g,"").length];
    for(var i=0;i<20;i++){ var x=FROMLETTER[s.a1.charAt(i)]; row.push((x?LETTER[x]:"")+(s.m1[i]?" ("+s.m1[i]+")":"")); }
    for(i=0;i<20;i++){ var y=FROMLETTER[s.a2.charAt(i)]; row.push((y?LETTER[y]:"")+(s.m2[i]?" ("+s.m2[i]+")":"")); }
    row=row.concat([s.q[0],s.q[1],s.q[2],s.at]); rows.push(row.map(q).join(",")); });
  return rows.join("\n");
}

function analyse(se){
  var list=studentsOf(se), n=list.length, R={n:n,list:list};
  var mix={analyst:0,diplomat:0,sentinel:0,explorer:0,none:0}; list.forEach(function(s){ mix[FROMLETTER[s.r]||"none"]++; }); R.mix=mix;
  var teams={}; list.forEach(function(s){ var k=(s.t||"").toLowerCase(); if(!teams[k]) teams[k]={name:teamLabel(s.t),m:[],have:{}}; teams[k].m.push(s); if(FROMLETTER[s.r]) teams[k].have[FROMLETTER[s.r]]=1; });
  R.teams=Object.keys(teams).sort(function(x,y){ return x.localeCompare(y,undefined,{numeric:true}); }).map(function(k){ var tm=teams[k]; tm.missing=ROLES.filter(function(r){return !tm.have[r];});
    tm.need={}; ["a1","a2"].forEach(function(key){ for(var i=0;i<20;i++){ var c={}, best=null; tm.m.forEach(function(s){ var r=FROMLETTER[s[key].charAt(i)]; if(r){ c[r]=(c[r]||0)+1; if(!best||c[r]>c[best]) best=r; } }); if(best && tm.missing.indexOf(best)>-1) tm.need[best]=(tm.need[best]||0)+1; } });
    var tmm=0, tma=0; tm.m.forEach(function(s){ ["p1","p2"].forEach(function(p){ var key=p==="p1"?"a1":"a2"; for(var i=0;i<20;i++){ var r=FROMLETTER[s[key].charAt(i)]; if(r){ tma++; if(r===fit(p,i)) tmm++; } } }); }); tm.matchPct=tma?Math.round(tmm/tma*100):null;
    tm.needTxt=tm.missing.map(function(r){ return rn(r)+(tm.need[r]?" ("+K("tasksN")(tm.need[r])+")":""); }).join(", ");
    return tm; });
  R.proj={}; var against=0, totalAs=0;
  ["p1","p2"].forEach(function(p){
    var key=p==="p1"?"a1":"a2", tot={analyst:0,diplomat:0,sentinel:0,explorer:0}, sum=0, tasks=[];
    PROJECTS[p].tasks.forEach(function(x,i){
      var cnt={analyst:0,diplomat:0,sentinel:0,explorer:0}, tt=0;
      list.forEach(function(s){ var r=FROMLETTER[s[key].charAt(i)]; if(r){ cnt[r]++; tt++; tot[r]++; sum++; totalAs++; if(r!==x[0]) against++; } });
      var top=ROLES.slice().sort(function(a1,a2){return cnt[a2]-cnt[a1];})[0];
      tasks.push({i:i,cnt:cnt,tot:tt,top:top,pct:tt?Math.round(cnt[top]/tt*100):0,key:x[0],kPct:tt?Math.round(cnt[x[0]]/tt*100):0});
    });
    var order=ROLES.slice().sort(function(x,y){return tot[y]-tot[x];});
    var withData=tasks.filter(function(x){return x.tot>=Math.max(2,Math.ceil(n*0.3));});
    var agree=withData.slice().sort(function(x,y){return y.pct-x.pct || y.tot-x.tot;});
    var split=withData.slice().sort(function(x,y){return x.pct-y.pct || y.tot-x.tot;});
    var mt=0; tasks.forEach(function(x){ mt+=x.cnt[x.key]; });
    var diffs=tasks.filter(function(x){return x.tot>0 && x.top!==x.key;}).sort(function(x,y){return x.kPct-y.kPct || y.tot-x.tot;});
    R.proj[p]={matchN:mt,matchPct:sum?Math.round(mt/sum*100):0,diffs:diffs.slice(0,3),fitc:fitCounts(p),tot:tot,sum:sum,order:order,leanPct:sum?Math.round((tot[order[0]]+tot[order[1]])/sum*100):0,agree:agree.slice(0,3),split:split[0]||null};
  });
  R.stretchPct=totalAs?Math.round(against/totalAs*100):0; R.totalAs=totalAs;
  R.reflDone=list.filter(function(s){ return s.q.every(function(x){return x && x.trim();}); }).length;
  return R;
}
function deckSlides(se){

  s1+='<div class="dk-teams">'+A.teams.map(function(tm){ return '<div class="teamrow"><div class="tn"><span>'+esc(tm.name)+(tm.matchPct!=null?' <span class="tag" style="--cbg:#efede7;--cink:var(--ink)">🔑 '+tm.matchPct+'%</span>':'')+'</span><span class="saved" style="'+(tm.missing.length?"color:#8a5600":"color:var(--diplomat-ink)")+'">'+(tm.missing.length?"🔎 "+esc(K("lookingFor")+tm.needTxt):"✓ "+esc(t("clsTeamAll")))+'</span></div><div class="tm">'+tm.m.map(function(s){var r=FROMLETTER[s.r];return '<span class="tag" style="'+(r?cvars(r):"--cbg:var(--none-bg);--cink:var(--muted)")+'">'+esc(s.n)+(r?' · '+esc(rn(r)):'')+'</span>';}).join("")+'</div></div>'; }).join("")+'</div></div>';
  slides.push(s1);

    s2+='<div class="kicker" style="margin-top:12px">'+esc(t("diffsTitle"))+'</div><ul class="matchlist">'+(P.diffs.length?P.diffs.map(function(x){return '<li style="'+cvars(x.key)+'"><span class="nn">#'+(x.i+1)+'</span><span>'+esc(taskTitle(p,x.i))+'<br><span class="saved">'+esc(t("classChose"))+': <b style="color:var(--'+x.top+'-ink)">'+esc(rn(x.top))+'</b> · 🔑 '+esc(t("modelW"))+': <b style="color:var(--cink)">'+esc(rn(x.key))+'</b></span></span></li>';}).join(""):'<li>'+(P.sum?'✓ '+esc(t("noDiffs")):esc(t("noData")))+'</li>')+'</ul></div>';
  });
  s2+='</div>'; slides.push(s2);
  // slide 3
  var ins=[];
  if(n){ var srt=ROLES.slice().sort(function(x,y){return A.mix[y]-A.mix[x];}), dom=srt[0];

  var miss=A.teams.filter(function(tm){return tm.missing.length && tm.name!==t("noTeam");});
  ins.push([null, miss.length?t("insMissing")(miss.map(function(tm){return tm.name+" → "+tm.needTxt;}).join("; ")):t("insAllTeams")]);
  ["p1","p2"].forEach(function(p){ var P=A.proj[p]; if(P.sum) ins.push([P.order[0], t("insLean")(PROJECTS[p].emoji+" "+pr(p).short, rn(P.order[0]), rn(P.order[1]), P.leanPct)]); });
  var P1=A.proj.p1, P2=A.proj.p2, allSum=P1.sum+P2.sum;
  if(allSum){ ins.push([null, t("insMatch")(Math.round((P1.matchN+P2.matchN)/allSum*100))+((P1.sum&&P2.sum)?" "+t("insProjMatch")(pr("p1").short,P1.matchPct,pr("p2").short,P2.matchPct):"")]); }
  var worst=null; ["p1","p2"].forEach(function(p){ var d=A.proj[p].diffs[0]; if(d && (!worst || d.kPct<worst.d.kPct)) worst={p:p,d:d}; });

function printDeck(){
  var se=activeSession(), D=deckSlides(se);
  $("#printView").innerHTML='<div class="pvbar"><span>'+esc(t("printHint"))+'</span><span style="display:flex;gap:8px"><button class="btn" id="pvPrint">⎙ '+esc(t("printNow"))+'</button><button class="btn" id="pvBack">← '+esc(t("back"))+'</button></span></div>'+D.slides.map(function(s){return '<div class="pslide"><div class="dk-slide">'+s+'</div></div>';}).join("");
  closeDeck(); document.body.classList.add("printing"); try{ window.scrollTo(0,0); }catch(e){}
}
function endCollection(){ C.session.closedAt=new Date().toISOString(); saveC(); render(); openDeck(); }
function reopenCollection(){ delete C.session.closedAt; saveC(); render(); }

document.addEventListener("click",function(e){
  var el, tg=e.target;
  if((el=tg.closest("[data-jlang]"))){ var nm=$("#joinName").value, tm=$("#joinTeam").value; S.lang=el.dataset.jlang; save(); render(); openJoin(); $("#joinName").value=nm; $("#joinTeam").value=tm; return; }
  if(tg.closest("#joinOk")){ joinSubmit(); return; }
  if(tg.closest("#bStudentView")){ S.instructor=false; S.forceStudent=true; S.presenter=false; if(S.view==="class") S.view="p1"; save(); render(); if(!S.reflection.name.trim()) openJoin(); return; }
  if(tg.closest("#endCollect")){ endCollection(); return; }
  if(tg.closest("#reopenCollect")){ reopenCollection(); return; }
  if(tg.closest("#showConcl")){ openDeck(); return; }
  if((el=tg.closest("[data-dlang]"))){ S.lang=el.dataset.dlang; save(); render(); renderDeck(); return; }
  if(tg.closest("#dkClose")){ closeDeck(); return; }
  if(tg.closest("#dkPrev")){ if(deckIdx>0){ deckIdx--; renderDeck(); } return; }
  if(tg.closest("#dkNext")){ if(deckData && deckIdx<deckData.slides.length-1){ deckIdx++; renderDeck(); } return; }
  if(tg.closest("#dkCopy")){ copyText(deckText(), t("copied")); return; }
  if(tg.closest("#dkPrint")){ printDeck(); return; }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter" && $("#modal").classList.contains("open") && (e.target.id==="joinName"||e.target.id==="joinTeam")){ e.preventDefault(); joinSubmit(); }
  if(!$("#deck").classList.contains("open")) return;
  if(e.key==="Escape"){ e.preventDefault(); closeDeck(); }
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ if(deckData && deckIdx<deckData.slides.length-1){ deckIdx++; renderDeck(); } e.preventDefault(); }
  if(e.key==="ArrowLeft"||e.key==="PageUp"){ if(deckIdx>0){ deckIdx--; renderDeck(); } e.preventDefault(); }
});



/* ================= Classes & groups (instructor) ================= */
function openClassModal(edit){
  var se=edit?C.session:null, d=new Date();
  var nm=se?se.name:(t("classDefault")+" "+d.toISOString().slice(0,10));
  var gs=se?(se.groups||[]):DEFAULT_GROUPS;
  openModal('<h3>📚 '+esc(edit?t("editClass"):t("newClass"))+'</h3>'+
    '<div style="margin:10px 0"><label class="saved" for="cName">'+esc(t("classNameLbl"))+'</label><input class="urlin" id="cName" maxlength="80" value="'+esc(nm)+'"></div>'+
    '<label class="saved" for="cGroups">'+esc(t("groupsLbl"))+'</label><div class="hints" style="margin:4px 0 6px">'+[1,2,3,4,5,6,8].map(function(n){return '<button class="hint" data-gq="'+n+'">'+n+'</button>';}).join("")+'</div>'+
    '<textarea id="cGroups" class="grpta" rows="6">'+esc(gs.join("\n"))+'</textarea><div class="note" style="margin-top:4px">'+esc(t("groupsHint"))+'</div>'+
    (edit?'<div class="warn">'+esc(t("editWarn"))+'</div>':'')+
    '<div class="row"><button class="btn" data-close>'+esc(t("cancel"))+'</button><button class="btn accent" id="cSave" data-edit="'+(edit?1:0)+'">'+esc(edit?t("saveBtn"):t("createBtn"))+'</button></div>');
}
function saveClassModal(edit){
  var nm=$("#cName").value.trim(); if(!nm){ $("#cName").focus(); return; }
  var gs=$("#cGroups").value.split(/\n|;/).map(function(x){return x.trim();}).filter(function(x,i,arr){return x && arr.indexOf(x)===i;}).slice(0,30);
  if(edit){ C.session.name=nm; C.session.groups=gs; }
  else { C.classes=C.classes.filter(function(x){ return Object.keys(x.students).length || !/^Workshop \d{4}-/.test(x.name); }); var c=newSession(nm,gs); C.classes.push(c); C.activeId=c.id; }
  viewingArchive=null; saveC(); closeModal(); render(); window.scrollTo(0,0);
}
var grpProj="p1";
function openGroup(key){
  var se=activeSession(), k=String(key||"").toLowerCase();
  var mem=studentsOf(se).filter(function(s){return (s.t||"").toLowerCase()===k;});
  if(!mem.length) return;
  var p=grpProj, akey=p==="p1"?"a1":"a2";
  var agreeAll=0, withData=0, memMatch=mem.map(function(){return {m:0,a:0};});
  var rows=PROJECTS[p].tasks.map(function(x,i){
    var cnt={}, best=null, tot=0;
    var cells=mem.map(function(s,j){ var r=FROMLETTER[s[akey].charAt(i)]; if(r){ cnt[r]=(cnt[r]||0)+1; tot++; if(!best||cnt[r]>cnt[best]) best=r; memMatch[j].a++; if(r===x[0]) memMatch[j].m++; }
      return '<td class="gc">'+(r?'<span class="gl" style="'+cvars(r)+'">'+LETTER[r]+'</span>':'<span class="saved">·</span>')+'</td>'; }).join("");
    if(tot){ withData++; if(cnt[best]===tot && tot===mem.length) agreeAll++; }
    var cons=best?'<span class="gl" style="'+cvars(best)+'">'+LETTER[best]+'</span>'+(cnt[best]<tot?'<span class="saved"> '+cnt[best]+'/'+tot+'</span>':''):'—';
    return '<tr><td class="n">'+(i+1)+'</td><td>'+esc(taskTitle(p,i))+'</td>'+cells+'<td class="gc gteam">'+cons+'</td><td class="gc"><span class="gl" style="'+cvars(x[0])+'">'+LETTER[x[0]]+'</span>'+(best?(best===x[0]?' ✓':''):'')+'</td></tr>';
  }).join("");
  var have={}; mem.forEach(function(s){ if(FROMLETTER[s.r]) have[FROMLETTER[s.r]]=1; });
  var miss=ROLES.filter(function(r){return !have[r];});
  var h='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3 style="margin:0">⇄ '+esc(teamLabel(mem[0].t))+' <span class="saved">· '+esc(se.name)+'</span></h3><div style="display:flex;gap:6px">'+["p1","p2"].map(function(pp){return '<button class="chip" data-gproj="'+pp+'" data-gkey="'+esc(mem[0].t)+'" aria-pressed="'+(pp===p)+'">'+PROJECTS[pp].emoji+' '+esc(pr(pp).short)+'</button>';}).join("")+'</div></div>';
  h+='<div class="gsum"><span class="tag" style="--cbg:#efede7;--cink:var(--ink)">🤝 '+esc(t("grpAgree")(withData?Math.round(agreeAll/withData*100):0))+'</span>';
  h+=mem.map(function(s,j){var r=FROMLETTER[s.r];return '<span class="tag" style="'+(r?cvars(r):"--cbg:var(--none-bg);--cink:var(--muted)")+'">'+esc(s.n)+(r?' · '+esc(rn(r)):'')+' · 🔑 '+(memMatch[j].a?Math.round(memMatch[j].m/memMatch[j].a*100)+'%':'—')+'</span>';}).join("");
  h+= miss.length?'<span class="tag" style="--cbg:#fff6e0;--cink:#6b4a00">🔎 '+esc(K("lookingFor")+miss.map(rn).join(", "))+'</span>':'<span class="tag" style="--cbg:#e7f6ee;--cink:#0b5c3e">✓ '+esc(t("clsTeamAll"))+'</span>';
  h+='</div><div class="tblwrap"><table class="load gtable"><thead><tr><th>#</th><th></th>'+mem.map(function(s){return '<th class="gc">'+esc(s.n)+'</th>';}).join("")+'<th class="gc">'+esc(t("colTeam"))+'</th><th class="gc">🔑</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  h+='<div class="note">A = '+esc(rn("analyst"))+' · D = '+esc(rn("diplomat"))+' · S = '+esc(rn("sentinel"))+' · E = '+esc(rn("explorer"))+'</div><div class="row"><button class="btn primary" data-close>'+esc(t("close"))+'</button></div>';
  openModal(h,true);
}
document.addEventListener("click",function(e){
  var el, tg=e.target;
  if(tg.closest("#clsNew")){ openClassModal(false); return; }
  if(tg.closest("#clsEdit")){ openClassModal(true); return; }
  if((el=tg.closest("#cSave"))){ saveClassModal(el.dataset.edit==="1"); return; }
  if((el=tg.closest("[data-gq]"))){ var n=+el.dataset.gq, arr=[]; for(var i=1;i<=n;i++) arr.push(String(i)); $("#cGroups").value=arr.join("\n"); return; }
  if((el=tg.closest("[data-grp]"))){ openGroup(el.dataset.grp); return; }
  if((el=tg.closest("[data-gproj]"))){ grpProj=el.dataset.gproj; openGroup(el.dataset.gkey); return; }
});
document.addEventListener("change",function(e){
  if(e.target.id==="clsSel"){ C.activeId=e.target.value; viewingArchive=null; saveC(); render(); }
});

/* ================= Events ================= */
function readFiles(files, cb){ var arr=[], left=files.length; if(!left) return; Array.prototype.forEach.call(files,function(f){ var fr=new FileReader(); fr.onload=function(){ arr.push(String(fr.result)); if(--left===0) cb(arr); }; fr.onerror=function(){ if(--left===0) cb(arr); }; fr.readAsText(f); }); }

document.addEventListener("click",function(e){
  var el, tg=e.target;
  // intro
  if((el=tg.closest("[data-ilang]"))){ stopSpeak(); S.lang=el.dataset.ilang; save(); render(); renderIntro(); return; }
  if(tg.closest("#iSkip")){ closeIntro(); return; }
  if(tg.closest("#iNext")){ if(slide===INTRO[S.lang].length-1) closeIntro(); else goSlide(slide+1,true); return; }
  if(tg.closest("#iPrev")){ goSlide(slide-1,true); return; }
  if((el=tg.closest("[data-dot]"))){ goSlide(+el.dataset.dot,true); return; }
  if(tg.closest("#iListen")){ if(speaking) stopSpeak(); else { var s=INTRO[S.lang][slide]; speak(s.h+". "+s.p); } return; }
  if(tg.closest("#bIntro")){ openIntro(); return; }
  // chrome
  if((el=tg.closest("[data-lang]"))){ S.lang=el.dataset.lang; save(); render(); return; }
  if(tg.closest("#presToggle")){ S.presenter=!S.presenter; save(); render(); return; }
  if((el=tg.closest(".rolecard"))){ var r=el.dataset.role; S.myRole=S.myRole===r?null:r; if(S.myCode && codeToRole(S.myCode)!==S.myRole) S.myCode=""; if(!S.myRole && S.filter==="mine") S.filter="all"; save(); render(); return; }
  if((el=tg.closest(".tab"))){ S.view=el.dataset.view; if(S.view!=="class") viewingArchive=null; save(); render(); return; }
  if((el=tg.closest("[data-filter]"))){ S.filter=el.dataset.filter; save(); render(); return; }
  if((el=tg.closest(".pill")) && el.closest(".task")){
    var row=el.closest(".task"), p=row.dataset.p, n=+row.dataset.n, v=el.dataset.set||null;
    if(v && a(p,n).role===v) v=null;
    setA(p,n,{role:v});
    if(S.filter==="all"||S.filter==="mine"){ var tmp=document.createElement("div"); tmp.innerHTML=taskHTML(p,n-1); row.replaceWith(tmp.firstChild); $("#balance").innerHTML=balanceHTML(p); renderTabs(); var nb=document.querySelector('.task[data-n="'+n+'"] .pill[data-set="'+(v||"")+'"]'); if(nb) nb.focus(); }
    else render();
    return;
  }
  if((el=tg.closest(".hint"))){ var ta=document.getElementById(el.dataset.target); if(ta){ var pre=ta.value && !/\n$/.test(ta.value)?"\n":""; ta.value+=pre+el.dataset.hint+" "; ta.dispatchEvent(new Event("input",{bubbles:true})); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length); } return; }
  if(tg.closest("#bCopy")){ copyText(summaryText(), t("copied")); return; }
  if(tg.closest("#bExport")){ openExport(); return; }
  if(tg.closest("#bPrint")){ openPrint(); return; }
  if(tg.closest("#bReset")){ openReset(); return; }
  if(tg.closest("#bSubmit") || tg.closest("[data-submit]")){ openSubmit(); return; }
  // modal
  if(tg.closest("[data-close]") || tg.id==="modal"){ closeModal(); return; }
  if(tg.closest("#doCopyJson")){ copyText($("#jsonBox").value, t("copied")); return; }
  if(tg.closest("#doDownload")){ saveFile("workshop-roles-"+safeName(S.reflection.name||"team")+".json", exportJSON()); return; }
  if(tg.closest("#doImport")){ doImport($("#jsonBox").value); return; }
  if(tg.closest("#doReset")){
    var mode=(document.querySelector('input[name="rs"]:checked')||{}).value;
    if(mode==="cur"){ S.assign[(S.view==="p2")?"p2":"p1"]={}; }
    else if(mode==="all"){ S.assign={p1:{},p2:{}}; }
    else if(mode==="every"){ var keep={lang:S.lang,presenter:S.presenter,autoRead:S.autoRead}; S=blank(); S.lang=keep.lang; S.presenter=keep.presenter; S.autoRead=keep.autoRead; S.introSeen=false; }
    save(); closeModal(); render(); toast(t("resetDone")); if(mode==="every" && !S.presenter) openIntro(); return;
  }
  if(tg.closest("#subNameOk")){ var nm=$("#subName").value.trim(); if(!nm){ $("#subName").focus(); return; } S.reflection.name=nm; S.reflection.team=$("#subTeam").value.trim(); save(); render(); openSubmit(); return; }
  if(tg.closest("#subCopy")){ copyText(encodeSub(), t("codeCopied")); return; }
  if(tg.closest("#subDl")){ saveFile("workshop-"+safeName(S.reflection.name)+".json", JSON.stringify({app:"hk-team-roles-workshop",type:"submission",name:S.reflection.name,team:S.reflection.team,code:encodeSub()},null,1)); return; }
  // print
  if(tg.closest("#pvPrint")){ try{ window.print(); }catch(err){} return; }
  if(tg.closest("#pvBack")){ closePrint(); return; }
  // class
  if(tg.closest("#clsAdd")){ if(C.session.closedAt){ toast(t("collectClosed")); return; } var tx=$("#clsPaste").value; if(tx.trim()){ addIncoming([tx]); } return; }
  if(tg.closest("#copyLink")){ copyText(classLink(), t("copied")); return; }
  if(tg.closest("#bigQr")){ openModal('<div class="bigqr"><h3>'+esc(C.session.name)+'</h3><div class="qrbox">'+qrSVG(classLink())+'</div><div class="u">'+esc(baseUrl())+'</div><div class="row" style="justify-content:center"><button class="btn primary" data-close>'+esc(t("close"))+'</button></div></div>',true); return; }
  if((el=tg.closest("[data-cproj]"))){ C.classProj=el.dataset.cproj; saveC(); var y=window.scrollY; render(); window.scrollTo(0,y); return; }
  if((el=tg.closest("[data-stu]"))){ studentModal(el.dataset.stu); return; }
  if((el=tg.closest("[data-stu-del]"))){ delete C.session.students[el.dataset.stuDel]; saveC(); render(); return; }
  if(tg.closest("#sessCsv")){ copyText(sessionCSV(activeSession()), t("copied")); return; }
  if(tg.closest("#sessDl")){ dlSession(C.session); return; }
  if(tg.closest("#sessArchive")){ openArchive(); return; }
  if(tg.closest("#doArchive")){ doArchive(); return; }
  if((el=tg.closest("[data-arch-open]"))){ viewingArchive=el.dataset.archOpen; render(); window.scrollTo(0,0); return; }
  if((el=tg.closest("[data-arch-dl]"))){ var id=el.dataset.archDl, se=C.archives.filter(function(x){return x.id===id;})[0]; if(se) dlSession(se); return; }
  if((el=tg.closest("[data-arch-del]"))){ var did=el.dataset.archDel; openModal('<h3>'+esc(t("archDelete"))+'</h3><p class="brief">'+esc(t("archDelConfirm"))+'</p><div class="row"><button class="btn" data-close>'+esc(t("cancel"))+'</button><button class="btn primary" style="background:#b42318;border-color:#b42318" data-arch-del-ok="'+esc(did)+'">'+esc(t("delete"))+'</button></div>'); return; }
  if((el=tg.closest("[data-arch-del-ok]"))){ var xid=el.dataset.archDelOk; C.archives=C.archives.filter(function(x){return x.id!==xid;}); if(viewingArchive===xid) viewingArchive=null; saveC(); closeModal(); render(); toast(t("archDeleted")); return; }
  if(tg.closest("#archBack")){ viewingArchive=null; render(); return; }
});
document.addEventListener("input",function(e){
  var el=e.target;
  if(el.id==="codeIn"){
    var code=el.value.toUpperCase().replace(/[^EINSTFJPA\-]/g,""); if(code!==el.value) el.value=code;
    S.myCode=code; var r=codeToRole(code), msg=$("#codeMsg");
    if(r){ if(S.myRole!==r){ S.myRole=r; save(); var pos=el.selectionStart; render(); var ni=$("#codeIn"); ni.focus(); try{ni.setSelectionRange(pos,pos);}catch(x){} return; } msg.textContent=t("codeOk")(code,rn(r)); msg.style.color="var(--"+r+"-ink)"; msg.style.fontWeight="600"; }
    else { msg.textContent=code.length>=4?t("codeBad"):""; msg.style.color=""; msg.style.fontWeight=""; }
    save(); return;
  }
  if(el.classList.contains("member")){ var row=el.closest(".task"); setA(row.dataset.p,+row.dataset.n,{member:el.value}); return; }
  if(el.dataset && el.dataset.ref){ S.reflection[el.dataset.ref]=el.value; save();
    document.querySelectorAll('[data-ref="'+el.dataset.ref+'"]').forEach(function(o){ if(o!==el) o.value=el.value; }); return; }
  if(el.id==="qrUrl"){ C.qrUrl=el.value.trim(); saveC(); var box=$("#qrBox"); if(box) box.innerHTML=qrSVG(classLink()); return; }
  if(el.id==="sessName" && !viewingArchive){ C.session.name=el.value; saveC(); return; }
});
document.addEventListener("change",function(e){
  var el=e.target;
  if(el.id==="fitT"){ S.showFit=el.checked; save(); render(); return; }
  if(el.id==="iAuto"){ S.autoRead=el.checked; save(); if(!el.checked) stopSpeak(); return; }
  if(el.classList.contains("member")){ refreshMembers(); var row=el.closest(".task"), nm=row.querySelector(".mname"); if(el.value.trim()){ if(!nm){ nm=document.createElement("span"); nm.className="mname"; el.after(nm);} nm.textContent=el.value; } else if(nm) nm.remove(); return; }
  if(el.dataset && (el.dataset.ref==="name"||el.dataset.ref==="team")){ if(S.view==="me" && !$("#view").contains(document.activeElement)){ var y=window.scrollY; render(); window.scrollTo(0,y); } refreshMembers(); return; }
  if(el.id==="jsonFile" && el.files && el.files[0]){ readFiles(el.files,function(arr){ $("#jsonBox").value=arr[0]; doImport(arr[0]); }); return; }
  if((el.id==="clsFiles"||el.id==="archFiles") && el.files && el.files.length){ readFiles(el.files,function(arr){ addIncoming(arr); }); return; }
});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"){
    if($("#modal").classList.contains("open")){ e.preventDefault(); closeModal(); }
    else if($("#intro").classList.contains("open")){ e.preventDefault(); closeIntro(); }
    else if(document.body.classList.contains("printing")) closePrint();
  }
  if($("#intro").classList.contains("open") && !/INPUT|TEXTAREA/.test((e.target.tagName||""))){
    if(e.key==="ArrowRight"){ if(slide<INTRO[S.lang].length-1) goSlide(slide+1,true); }
    if(e.key==="ArrowLeft"){ goSlide(slide-1,true); }
  }
});

window.addEventListener("hashchange",function(){
  var h=(location.hash||"").replace("#","").toLowerCase();
  if(h==="instructor"||h==="prowadzacy"||h==="vyucujici"){ if(!S.instructor){ S.instructor=true; S.forceStudent=false; save(); closeModal(); render(); toast("🎓 "+t("instructorLbl")); } }
  else if(h==="student"){ if(S.instructor){ S.instructor=false; S.forceStudent=true; S.presenter=false; if(S.view==="class") S.view="p1"; save(); render(); } }
});
render();
if(!S.instructor && (!S.reflection.name.trim() || (S.cls && S.cls.g.length && !S.reflection.team))) setTimeout(openJoin,50);
})();

</script>
